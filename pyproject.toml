[project]
name = "prompt-optimizer"
version = "0.1.0"
description = "Quality-first prompt router with calibrated classifiers"
readme = "ReadMe.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "scikit-learn>=1.7,<2.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "joblib>=1.4,<2.0",
    "matplotlib>=3.8,<4.0",
    "nltk>=3.9,<4.0",
    "sentence-transformers>=3.0,<4.0",
    "pydantic>=2.6,<3.0",
    "openai>=1.40,<3.0",
    "anthropic>=0.40,<1.0",
    "claude-agent-sdk>=0.1.80,<0.2",
    "playwright>=1.45,<2.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "tiktoken>=0.7,<1.0",
    "pre-commit>=4.0,<5.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sse-starlette>=2.1,<4.0",
    "aiosqlite>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-timeout>=2.3,<3.0",
    "httpx-sse>=0.4,<1.0",
]
keyring = ["keyring>=24,<26"]

[project.scripts]
route-decide = "src.routing.decide:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "apps"]

[tool.pytest.ini_options]
testpaths = ["src", "apps"]
python_files = ["test_*.py"]
# importlib mode keeps each src/<package>/tests/ directory in its own
# import namespace; otherwise the duplicate bare "tests" package names
# collide in sys.modules during collection.
addopts = "-x -q --import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "live: hits real provider APIs (BYOK required); skipped by default",
]
